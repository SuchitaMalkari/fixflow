name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate (fails the build if quality drops)
        run: python -m fixflow.evals --split test --min-action-accuracy 90

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fixflow .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name fixflow fixflow
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/triage -H 'content-type: application/json' \
            -d '{"text":"there is smoke coming from my laptop"}' | grep -q '"action":"escalate"'
