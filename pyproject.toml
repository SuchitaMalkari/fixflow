[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixflow"
version = "0.1.0"
description = "AI agent that triages IT-support requests: RAG from scratch, guarded LLM triage, evals and an MCP server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suchita Malkari" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
fixflow = "fixflow.__main__:main"
fixflow-mcp = "fixflow.mcp_server:main"
fixflow-eval = "fixflow.evals:main"

[tool.setuptools]
packages = ["fixflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
